<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500"   font-family="Inter, DejaVu Sans, sans-serif"><defs><marker id="fa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2a22" flood-opacity="0.12"/></filter></defs><rect x="60" y="60" width="260" height="96" rx="48" fill="#e8f1e4" stroke="#2f5d36" stroke-width="2.6" filter="url(#sh)"/><text x="190.0" y="104" font-size="21" font-weight="800" fill="#2f5d36" text-anchor="middle" >ESPERANDO</text><text x="190.0" y="130" font-size="14" font-weight="600" fill="#55625a" text-anchor="middle" >bomba apagada</text><rect x="420" y="60" width="260" height="96" rx="48" fill="#e3eefb" stroke="#1565c0" stroke-width="2.6" filter="url(#sh)"/><text x="550.0" y="104" font-size="21" font-weight="800" fill="#1565c0" text-anchor="middle" >REGANDO</text><text x="550.0" y="130" font-size="14" font-weight="600" fill="#55625a" text-anchor="middle" >bomba encendida</text><rect x="780" y="60" width="260" height="96" rx="48" fill="#fff6d6" stroke="#ef6c00" stroke-width="2.6" filter="url(#sh)"/><text x="910.0" y="104" font-size="21" font-weight="800" fill="#ef6c00" text-anchor="middle" >REPOSO</text><text x="910.0" y="130" font-size="14" font-weight="600" fill="#55625a" text-anchor="middle" >60 s sin regar</text><rect x="420" y="330" width="260" height="96" rx="48" fill="#fdecea" stroke="#c62828" stroke-width="2.6" filter="url(#sh)"/><text x="550.0" y="374" font-size="21" font-weight="800" fill="#c62828" text-anchor="middle" >BLOQUEO</text><text x="550.0" y="400" font-size="14" font-weight="600" fill="#55625a" text-anchor="middle" >riego detenido</text><path d="M 322 92 L 416 92" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="369" y="82" font-size="13.5" font-weight="700" fill="#1f2a22" text-anchor="middle" >suelo &lt; 30 %</text><path d="M 418 134 C 340 200 260 200 200 160" fill="none" stroke="#2f5d36" stroke-width="3" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="214" font-size="13.5" font-weight="700" fill="#1f2a22" text-anchor="middle" >suelo ≥ 60 %</text><text x="300" y="232" font-size="12.5" font-weight="500" fill="#55625a" text-anchor="middle" >(contador a 0)</text><path d="M 682 92 L 776 92" fill="none" stroke="#ef6c00" stroke-width="3" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="729" y="82" font-size="13.5" font-weight="700" fill="#1f2a22" text-anchor="middle" >10 s encendida</text><text x="729" y="122" font-size="12.5" font-weight="600" fill="#55625a" text-anchor="middle" >pulso +1</text><path d="M 910 158 C 910 250 720 250 640 162" fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="222" font-size="13.5" font-weight="700" fill="#1f2a22" text-anchor="start" >pasan 60 s y el suelo</text><text x="930" y="240" font-size="13.5" font-weight="700" fill="#1f2a22" text-anchor="start" >sigue &lt; 30 %</text><path d="M 550 160 L 550 326" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="236" font-size="13.5" font-weight="800" fill="#c62828" text-anchor="start" >3.er corte seguido</text><text x="566" y="254" font-size="13" font-weight="600" fill="#c62828" text-anchor="start" >→ alarma «deposito_vacio»</text><path d="M 418 380 C 250 380 180 300 180 160" fill="none" stroke="#2f5d36" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#fa)" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="400" font-size="13.5" font-weight="800" fill="#2f5d36" text-anchor="middle" >botón «Reiniciar bloqueo»</text><text x="550" y="470" font-size="15" font-weight="600" fill="#55625a" text-anchor="middle" >Cada corte por 10 s publica la alarma «anti_inundacion». El tope de 10 s también aplica en modo manual.</text></svg>